# 圣经 PWA 部署到国内轻量云 - nginx 配置
# 假设:域名 bible.example.com,后端跑在 127.0.0.1:8787,ws 跑在 127.0.0.1:8788

# 上游后端 API
upstream bible_api {
    server 127.0.0.1:8787;
    keepalive 32;
}

# 上游 WebSocket
upstream bible_ws {
    server 127.0.0.1:8788;
}

# HTTP 跳 HTTPS
server {
    listen 80;
    server_name bible.example.com;
    # 用于 Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name bible.example.com;

    # 证书路径(certbot 生成后)
    ssl_certificate     /etc/letsencrypt/live/bible.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bible.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # 前端静态文件(构建产物)
    root /var/www/scripture/dist;
    index index.html;

    # Service Worker 不能被缓存,必须每次拉最新
    location = /sw.js {
        root /var/www/scripture/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
    location = /workbox-*.js {
        root /var/www/scripture/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 静态资源长期缓存(带 hash 的文件名)
    location /assets/ {
        root /var/www/scripture/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 后端 API
    location /api/ {
        proxy_pass http://bible_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://bible_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
}
